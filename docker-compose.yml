name: filmerz

services:
  app:
    build:
      context: .
    image: filmerz:latest
    restart: unless-stopped
    stop_grace_period: 10s
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "${PORT:-3000}"
      SESSION_SECRET: "${SESSION_SECRET:?SESSION_SECRET is required}"
      TRUST_PROXY: "${TRUST_PROXY:-0}"
      APP_BASE_URL: "${APP_BASE_URL:-https://filmerz.ir}"
      COOKIE_SECURE: "${COOKIE_SECURE:-1}"
      REQUIRE_EMAIL_VERIFICATION: "${REQUIRE_EMAIL_VERIFICATION:-1}"
      AUTH_SESSION_TTL_MS: "${AUTH_SESSION_TTL_MS:-2592000000}"
      EMAIL_VERIFICATION_TTL_MS: "${EMAIL_VERIFICATION_TTL_MS:-86400000}"
      PASSWORD_RESET_TTL_MS: "${PASSWORD_RESET_TTL_MS:-1800000}"
      SCRYPT_N: "${SCRYPT_N:-65536}"
      SCRYPT_R: "${SCRYPT_R:-8}"
      SCRYPT_P: "${SCRYPT_P:-1}"
      SCRYPT_MAXMEM: "${SCRYPT_MAXMEM:-167772160}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-0}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      MAIL_REPLY_TO: "${MAIL_REPLY_TO:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_CALLBACK_URL: "${GOOGLE_CALLBACK_URL:-https://filmerz.ir/auth/google/callback}"
      GOOGLE_PROXY_URL: "${GOOGLE_PROXY_URL:-}"
      GOOGLE_TOKEN_URL: "${GOOGLE_TOKEN_URL:-https://oauth2.googleapis.com/token}"
      DATA_DIR: "${DATA_DIR:-/app/data}"
      APP_DB_PATH: "${APP_DB_PATH:-/app/data/app.db}"
      APP_DB: "${APP_DB:-/app/data/app.db}"
      UPLOADS_DIR: "${UPLOADS_DIR:-/app/data/uploads}"
      PER_PAGE: "${PER_PAGE:-24}"
      RESOLVE_TTL_MS: "${RESOLVE_TTL_MS:-180000}"
      SOURCE_TIMEOUT_MS: "${SOURCE_TIMEOUT_MS:-8000}"
      SOURCE_BASE_URL: "${SOURCE_BASE_URL:-https://flzios.com}"
      SOURCE_LOGIN_PATH: "${SOURCE_LOGIN_PATH:-/login}"
      SOURCE_PHONE: "${SOURCE_PHONE:-}"
      SOURCE_PASSWORD: "${SOURCE_PASSWORD:-}"
      SOURCE_PHONE_FIELD: "${SOURCE_PHONE_FIELD:-phone}"
      SOURCE_PASSWORD_FIELD: "${SOURCE_PASSWORD_FIELD:-password}"
      ALLOWED_DL_HOSTS: "${ALLOWED_DL_HOSTS:-}"
      POSTER_HOSTS: "${POSTER_HOSTS:-}"
      LINKS_DB_PATH: /app/data/links-import.db
    ports:
      - "${APP_PORT:-3000}:${PORT:-3000}"
    volumes:
      - data:/app/data
      - backups:/app/backups
      - ./links.db:/app/data/links-import.db:ro
volumes:
  data:
  backups:
